[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lark-kernels"
version = "0.1.0"
description = "Lean-assisted verification of a strict CUDA/HIP kernel subset"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Harsh"}]
dependencies = []

[project.scripts]
lark = "lark_kernels.cli:main"

[tool.setuptools]
packages = ["lark_kernels"]

[tool.setuptools.data-files]
"share/lark/lean" = ["lean/lean-toolchain", "lean/lakefile.toml"]
"share/lark/lean/Lark" = ["lean/Lark/Model.lean", "lean/Lark/Nonlinear.lean", "lean/Lark/Pointwise.lean", "lean/Lark/Reduction.lean", "lean/Lark/DotLoop.lean", "lean/Lark/Matrix.lean", "lean/Lark/Bias.lean", "lean/Lark/Rotary.lean", "lean/Lark/Convolution.lean", "lean/Lark/UnaryMap.lean", "lean/Lark/FoldPhase.lean", "lean/Lark/Normalization.lean", "lean/Lark/DotMap.lean", "lean/Lark/Pipeline.lean", "lean/Lark/FeedForward.lean", "lean/Lark/PairMap.lean", "lean/Lark/SwiPointwise.lean", "lean/Lark/SwiGLU.lean", "lean/Lark/RowPhase.lean", "lean/Lark/RowSoftmax.lean", "lean/Lark/AttentionAddress.lean", "lean/Lark/AttentionPipeline.lean"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Preserve the exact reference bytes pinned by the recorded proof experiments.
"reproduction/cases/*/reference.py" = ["F401"]
"reproduction/nonlinear/cases/*/*/reference.py" = ["F401"]
"reproduction/pointwise/cases/*/*/reference.py" = ["F401"]
"reproduction/reduction/cases/*/reference.py" = ["F401"]
"reproduction/matrix/cases/*/*/reference.py" = ["F401"]
"reproduction/linear/cases/*/reference.py" = ["F401"]

"reproduction/rotary/cases/*/reference.py" = ["F401"]

"reproduction/convolution/cases/*/*/reference.py" = ["F401"]

"reproduction/normalization/cases/*/*/reference.py" = ["F401"]

"reproduction/feedforward/cases/*/reference.py" = ["F401"]

"reproduction/swiglu/cases/*/reference.py" = ["F401"]

"reproduction/attention/cases/*/*/reference.py" = ["F401"]
