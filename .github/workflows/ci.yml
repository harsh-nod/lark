            Mathlib.Analysis.SpecialFunctions.Sqrt \
            Mathlib.Algebra.BigOperators.Group.List.Basic Mathlib.Tactic.NormNum Mathlib.Data.Nat.Bitwise \
            Mathlib.Tactic.FieldSimp Mathlib.Tactic.Ring
        working-directory: lean-real
      - name: Check source-bound real wave reduction and tamper controls
        run: LARK_TEST_REAL=1 python3 -m unittest discover -s tests -p test_wave_sum.py -v
      - name: Check source-bound native RMSNorm certificates and tamper controls
        run: LARK_TEST_REAL=1 python3 -m unittest discover -s tests -p test_native_rmsnorm.py -v
      - name: Check real interpretation, machine specializations and algebra controls
        run: python3 reproduction/exact_real/run.py --output /tmp/lark-exact-real
      - name: Check native RMSNorm canonical-real whole launch
        run: lake build LarkReal.NativeRmsNorm
        working-directory: lean-real
      - name: Check online-attention algebra and false-update counterexamples
        run: python3 reproduction/online_attention/run_algebra.py --output /tmp/lark-online-algebra
      - name: Check source-bound native attention canonical-real whole launch
        run: python3 reproduction/online_attention/check_native_real.py --output /tmp/lark-native-attention-real
