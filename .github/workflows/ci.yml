          python3 reproduction/production_qknorm_rope/replay_native_real.py \
            --packet /tmp/lark-qknorm-rope-canonical-real --output /tmp/lark-qknorm-rope-canonical-real-replay \
            --lean-bin "$HOME/.elan/bin" --dependency-project lean-real
  fused-real:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned Lean toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/58e8d545e33641f66dbcbd22c4283109e71757be/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch locked optional dependencies
        run: |
          MATHLIB_NO_CACHE_ON_UPDATE=1 lake update
          git diff --exit-code -- lake-manifest.json
        working-directory: lean-real
      - name: Fetch selected Mathlib cache
        run: |
          lake exe cache get Mathlib.Data.Complex.Trigonometric \
            Mathlib.Analysis.SpecialFunctions.Sqrt \
            Mathlib.Algebra.BigOperators.Group.List.Basic Mathlib.Tactic.NormNum Mathlib.Data.Nat.Bitwise \
            Mathlib.Tactic.FieldSimp Mathlib.Tactic.Ring
        working-directory: lean-real
      - name: Check native fused RMSNorm real certificates and controls
        run: python3 reproduction/production_fused_rmsnorm/check_native_real.py --output /tmp/lark-fused-canonical-real
      - name: Replay frozen native fused RMSNorm real archive without Git or own compiled cache
        run: |
          python3 reproduction/production_fused_rmsnorm/replay_native_real.py \
            --packet /tmp/lark-fused-canonical-real --output /tmp/lark-fused-canonical-real-replay \
            --lean-bin "$HOME/.elan/bin" --dependency-project lean-real
  proof-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned Lean toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/58e8d545e33641f66dbcbd22c4283109e71757be/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install package
        run: python -m pip install -e .
      - name: Check machine model
        run: lake build
        working-directory: lean
      - name: Check nonlinear machine model
        run: lean Lark/Nonlinear.lean
        working-directory: lean
      - name: Check pointwise induction proof
        run: lake env lean Lark/Pointwise.lean
        working-directory: lean
      - name: Check counted-loop induction proof
        run: lake env lean Lark/Reduction.lean
        working-directory: lean
      - name: Check matrix address and dot-loop proofs
        run: lake env lean Lark/Matrix.lean
        working-directory: lean
      - name: Check multiwave scalar SiLU strided-loop proof
        run: lake env lean Lark/Silu.lean
        working-directory: lean
      - name: Check bias epilogue and Linear proof
        run: lake env lean Lark/Bias.lean
        working-directory: lean
      - name: Check interleaved rotary proof
        run: lake env lean Lark/Rotary.lean
        working-directory: lean
      - name: Check convolution address proofs
        run: lake env lean Lark/Convolution.lean
        working-directory: lean
      - name: Check normalization loop and grid proofs
        run: lake env lean Lark/Normalization.lean
        working-directory: lean
      - name: Check full-wave64 shuffle machine and transfer proof
        run: lake env lean Lark/ShuffleTransfer.lean
        working-directory: lean
      - name: Check full-wave64 MFMA machine and tile proof
        run: lake env lean Lark/MFMATile.lean
        working-directory: lean
      - name: Check native RMSNorm execution components
        run: lake build Lark.NativeRmsNormCorrect
        working-directory: lean
      - name: Check native in-place fused RMSNorm interface and source components
        run: python3 reproduction/production_fused_rmsnorm/check_program.py --output /tmp/lark-native-fused-rmsnorm-components
      - name: Rebuild native in-place fused RMSNorm whole seeded-inout launch outside Git
        run: python3 reproduction/production_fused_rmsnorm/check_prefix.py --stage whole-launch --output /tmp/lark-native-fused-rmsnorm-whole-launch
      - name: Check whole-launch report stage guards
        run: python3 reproduction/production_fused_rmsnorm/check_replay_stages.py --output /tmp/lark-fused-whole-stage-guards --lean-bin "$HOME/.elan/bin"
      - name: Check native tiled attention address and footprint components
        run: lake build Lark.NativeAttentionAddress
        working-directory: lean
      - name: Check native attention source identity and footprint witnesses
        run: python3 reproduction/online_attention/check_native_program.py --output /tmp/lark-native-attention-binding
      - name: Rebuild native attention execution prefix outside Git
        run: python3 reproduction/online_attention/check_native_prefix.py --stage whole-launch --output /tmp/lark-native-attention-prefix
      - name: Run tests, including Lean integration and mutants
        run: python -m unittest discover -s tests -v
      - name: Check two-launch FFN composition
        run: lake env lean Lark/FeedForward.lean
        working-directory: lean
      - name: Export example certificates
        run: python tools/verify_examples.py certificates
      - name: Check FP32-projection SwiGLU composition
        run: lake env lean Lark/SwiGLU.lean
        working-directory: lean
      - name: Check dense SDPA and grouped-query composition
        run: lake env lean Lark/AttentionPipeline.lean
        working-directory: lean
      - name: Recheck standalone export
        run: lake build
        working-directory: certificates/vector_add
      - name: Check production-race address witness
        run: python reproduction/production_race.py --output /tmp/lark-production-race
