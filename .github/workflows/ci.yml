            --finite-trace-packet reproduction/production_softmax/results/finite-trace-v2 \
            --output /tmp/lark-softmax-whole-block-replay --lean-bin "$HOME/.elan/bin"
      - name: Check whole-block report stage guards
        run: |
          python3 reproduction/production_softmax/check_whole_block_stages.py \
            --packet /tmp/lark-softmax-whole-block \
            --earlier-packet reproduction/production_softmax/results/reduction-prefix-v1 \
            --output /tmp/lark-softmax-whole-block-stage-guards --lean-bin "$HOME/.elan/bin"
  softmax-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
