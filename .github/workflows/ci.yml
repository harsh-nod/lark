name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native-flashinfer-rmsnorm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned Lean toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/58e8d545e33641f66dbcbd22c4283109e71757be/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check closed FlashInfer signature and reference boundary
        run: python3 -m unittest discover -s tests -p test_native_flashinfer_rmsnorm.py -v
      - name: Bind full source and prove address and conditional footprint components
        run: |
          python3 reproduction/production_flashinfer_rmsnorm/check_program.py \
            --output /tmp/lark-flashinfer-components --lean-bin "$HOME/.elan/bin"
      - name: Replay frozen components without Git or owned compiled caches
        run: |
          python3 reproduction/production_flashinfer_rmsnorm/replay_components.py \
            --packet /tmp/lark-flashinfer-components --output /tmp/lark-flashinfer-replay \
            --lean-bin "$HOME/.elan/bin"
      - name: Reject fully rehashed execution and certificate overclaims
        run: |
          python3 reproduction/production_flashinfer_rmsnorm/check_component_stages.py \
            --packet /tmp/lark-flashinfer-components --output /tmp/lark-flashinfer-stage-guards \
            --lean-bin "$HOME/.elan/bin"
      - name: Check finite expression DAGs, actual access patterns and source controls
        run: |
          python3 reproduction/production_flashinfer_rmsnorm/run_symbolic.py \
            --output /tmp/lark-flashinfer-symbolic
      - name: Prove actual native execution through the first block barrier
        run: |
          python3 reproduction/production_flashinfer_rmsnorm/check_execution.py \
            --output /tmp/lark-flashinfer-first-block --lean-bin "$HOME/.elan/bin"
      - name: Replay first-block execution from frozen sources without Git or owned caches
        run: |
          python3 reproduction/production_flashinfer_rmsnorm/replay_execution.py \
            --packet /tmp/lark-flashinfer-first-block --output /tmp/lark-flashinfer-first-block-replay \
            --lean-bin "$HOME/.elan/bin"
      - name: Reject overclaims about later execution and outputs
        run: |
          python3 reproduction/production_flashinfer_rmsnorm/check_execution_stages.py \
            --packet /tmp/lark-flashinfer-first-block --output /tmp/lark-flashinfer-first-block-stage-guards \
            --lean-bin "$HOME/.elan/bin"
  native-qknorm-rope:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned Lean toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/58e8d545e33641f66dbcbd22c4283109e71757be/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check closed fused Q/K host contract and reference boundary
        run: python3 -m unittest discover -s tests -p test_native_qknorm_rope.py -v
      - name: Bind both complete sources and check native ownership and bounds
        run: python3 reproduction/production_qknorm_rope/check_program.py --output /tmp/lark-fused-qk-components
      - name: Rebuild partial reduction and normalization execution proofs from fresh sources
        run: |
          python3 reproduction/production_qknorm_rope/check_execution_prefix.py \
            --output /tmp/lark-fused-qk-execution-prefix --lean-bin "$HOME/.elan/bin"
      - name: Check complete native interleaved physical-wave execution and false source controls
        run: |
          python3 reproduction/production_qknorm_rope/check_interleaved_wave.py \
            --output /tmp/lark-fused-qk-interleaved-wave --lean-bin "$HOME/.elan/bin"
      - name: Check complete interleaved grid, output extraction and source-order correctness
        run: |
          python3 reproduction/production_qknorm_rope/check_interleaved_launch.py \
            --output /tmp/lark-fused-qk-interleaved-launch --lean-bin "$HOME/.elan/bin"
      - name: Check complete split-half physical wave, both warp fences and changed-source controls
        run: |
          python3 reproduction/production_qknorm_rope/check_split_wave.py \
            --output /tmp/lark-fused-qk-split-wave --lean-bin "$HOME/.elan/bin"
      - name: Replay frozen components without Git or owned compiled caches
        run: |
          python3 reproduction/production_qknorm_rope/replay_components.py \
            --packet /tmp/lark-fused-qk-components --output /tmp/lark-fused-qk-replay \
            --lean-bin "$HOME/.elan/bin"
      - name: Reject rehashed proof-stage changes before extraction
        run: |
          python3 reproduction/production_qknorm_rope/check_component_stages.py \
            --packet /tmp/lark-fused-qk-components --output /tmp/lark-fused-qk-stage-guards \
            --lean-bin "$HOME/.elan/bin"
      - name: Execute all finite fused Q/K values and traces and reject source mutations
        run: python3 reproduction/production_qknorm_rope/run_symbolic.py --output /tmp/lark-fused-qk-symbolic
  native-rope:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned Lean toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/58e8d545e33641f66dbcbd22c4283109e71757be/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check native mutable Q/K contract and complete finite values
        run: python3 -m unittest discover -s tests -p test_native_rope.py -v
      - name: Bind both complete source layouts and check initialized interfaces and ownership
        run: python3 reproduction/production_rope/check_program.py --output /tmp/lark-rope-components
      - name: Replay frozen native RoPE components without Git or owned compiled caches
        run: |
          python3 reproduction/production_rope/replay_components.py \
            --packet /tmp/lark-rope-components --output /tmp/lark-rope-components-replay \
            --lean-bin "$HOME/.elan/bin"
      - name: Reject rehashed RoPE stage overclaims before extraction
        run: |
          python3 reproduction/production_rope/check_component_stages.py \
            --packet /tmp/lark-rope-components --output /tmp/lark-rope-stage-guards \
            --lean-bin "$HOME/.elan/bin"
      - name: Execute complete finite native Q/K traces and reject source mutations
        run: python3 reproduction/production_rope/run_symbolic.py --output /tmp/lark-rope-symbolic
      - name: Export and recheck both complete native RoPE layouts and reject false claims
        run: python3 reproduction/production_rope/run_whole.py --output /tmp/lark-rope-whole
      - name: Rebuild frozen whole-launch certificates without Git or owned proof caches
        run: |
          python3 reproduction/production_rope/replay_whole.py \
            --packet /tmp/lark-rope-whole --output /tmp/lark-rope-whole-replay \
            --lean-bin "$HOME/.elan/bin"
      - name: Reject rehashed whole-launch scope changes and promoted component packets
        run: |
          python3 reproduction/production_rope/check_whole_stages.py \
            --packet /tmp/lark-rope-whole \
            --earlier-packet reproduction/production_rope/results/components-v1 \
            --output /tmp/lark-rope-whole-stage-guards --lean-bin "$HOME/.elan/bin"
  softmax-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned Lean toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/58e8d545e33641f66dbcbd22c4283109e71757be/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check full softmax source binding, instruction witnesses and refusals
        run: python3 reproduction/production_softmax/check_program.py --output /tmp/lark-softmax-components
      - name: Replay frozen components and complete finite traces without Git or own compiled cache
        run: |
          python3 reproduction/production_softmax/replay_components.py \
            --packet /tmp/lark-softmax-components \
            --finite-trace-packet reproduction/production_softmax/results/finite-trace-v2 \
            --output /tmp/lark-softmax-components-replay --lean-bin "$HOME/.elan/bin"
      - name: Check closed native softmax contract and private-array ownership
        run: python3 -m unittest discover -s tests -p test_native_softmax.py -v
      - name: Check source-bound native softmax maximum prefix and rejection controls
        run: python3 reproduction/production_softmax/check_prefix.py --output /tmp/lark-softmax-max-prefix
      - name: Replay native softmax maximum-prefix archive without Git or own compiled cache
        run: |
          python3 reproduction/production_softmax/replay_prefix.py \
            --packet /tmp/lark-softmax-max-prefix \
            --finite-trace-packet reproduction/production_softmax/results/finite-trace-v2 \
            --output /tmp/lark-softmax-max-prefix-replay --lean-bin "$HOME/.elan/bin"
      - name: Check maximum-prefix report stage guards
        run: |
          python3 reproduction/production_softmax/check_prefix_stages.py \
            --packet /tmp/lark-softmax-max-prefix \
            --earlier-packet reproduction/production_softmax/results/components-v3 \
            --output /tmp/lark-softmax-max-prefix-stage-guards --lean-bin "$HOME/.elan/bin"
      - name: Check source-bound native softmax maximum first wave and rejection controls
        run: python3 reproduction/production_softmax/check_first_wave.py --output /tmp/lark-softmax-max-first-wave
      - name: Replay native softmax maximum-wave archive without Git or own compiled cache
        run: |
          python3 reproduction/production_softmax/replay_first_wave.py \
            --packet /tmp/lark-softmax-max-first-wave \
            --finite-trace-packet reproduction/production_softmax/results/finite-trace-v2 \
            --output /tmp/lark-softmax-max-first-wave-replay --lean-bin "$HOME/.elan/bin"
      - name: Check maximum-wave report stage guards
        run: |
          python3 reproduction/production_softmax/check_first_wave_stages.py \
            --packet /tmp/lark-softmax-max-first-wave \
            --earlier-packet reproduction/production_softmax/results/max-prefix-v1 \
            --output /tmp/lark-softmax-max-first-wave-stage-guards --lean-bin "$HOME/.elan/bin"
  softmax-block:
    runs-on: ubuntu-latest
