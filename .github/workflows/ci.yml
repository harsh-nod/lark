      - name: Check source-bound native softmax complete five-phase block and converted normalization outputs
        run: python3 reproduction/production_softmax/check_whole_block.py --output /tmp/lark-softmax-whole-block
      - name: Replay native softmax whole-block archive without Git or own compiled cache
        run: |
          python3 reproduction/production_softmax/replay_whole_block.py \
