      - name: Install pinned Lean toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/58e8d545e33641f66dbcbd22c4283109e71757be/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check source-bound repaired softmax complete grid and source-order Correct relation
        run: python3 reproduction/production_softmax/check_whole_grid.py --output /tmp/lark-softmax-whole-grid
      - name: Replay complete grid archive without Git or own compiled cache
        run: |
          python3 reproduction/production_softmax/replay_whole_grid.py \
            --packet /tmp/lark-softmax-whole-grid \
            --finite-trace-packet reproduction/production_softmax/results/finite-trace-v2 \
            --output /tmp/lark-softmax-whole-grid-replay --lean-bin "$HOME/.elan/bin"
      - name: Check whole-grid report stage guards
