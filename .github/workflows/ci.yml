name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  paper-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require six model cohorts and six complete-source PTX development proofs
        run: |
          python3 - <<'PY'
          import json
          import os
          import hashlib
          from pathlib import Path
          from reproduction.paper_results.replay_snapshot import DEFAULT
          snapshot = DEFAULT.resolve()
          targets = json.loads((snapshot / 'targets.json').read_text())
          report = json.loads((snapshot / 'results/audit.json').read_text())
          models = report.get('full_shape_model_evidence_checks', {})
          ptx = report.get('ptx_pointwise_evidence_checks', {})
          gemv = report.get('ptx_dot_evidence_checks', {})
          gemm = report.get('ptx_matrix_evidence_checks', {})
          bmm = report.get('ptx_batched_evidence_checks', {})
          linear = report.get('ptx_linear_evidence_checks', {})
          rotary = report.get('ptx_rotary_evidence_checks', {})
          assert snapshot.name == '20261113-v27' and targets['storage_schema'] == 2
          declared = {name for names in targets['evidence_groups'].values() for name in names}
          assert set(report['evidence_sha256']) == declared
          layout = json.loads((snapshot / 'evidence-layout.json').read_text())
          old = Path('reproduction/paper_results/snapshots/20261113-v26')
          assert hashlib.sha256((old / 'manifest.json').read_bytes()).hexdigest() == '251d9b381282f54cc721587bc88d78e0f344a44eaeaf03f112fb6f6556baf6ed'
          old_hashes = json.loads((old / 'evidence-manifest.json').read_text())
          definitions = {'reproduction/paper_results/audit.py', 'reproduction/paper_results/targets.json'}
          assert set(layout['logical_files']) == declared | definitions
          assert sum(name not in definitions for name in old_hashes) == 3792
          assert all(layout['logical_files'][name]['sha256'] == value for name, value in old_hashes.items() if name not in definitions)
          assert (Path('reproduction/paper_results/frozen-definitions/20261113-v26/auditor.py').read_bytes()
                  == (old / 'auditor.py').read_bytes())
          assert (Path('reproduction/paper_results/frozen-definitions/20261113-v26/targets.json').read_bytes()
                  == (old / 'targets.json').read_bytes())
          assert targets.get('full_shape_models', {}).get('required_cohorts') == 6, 'Final ledger must require all six cohorts'
          assert models.get('complete_independent_cohorts') == 6 and len(models.get('cohorts', [])) == 6
          assert models.get('all_six_independent_cohorts_present') is True and models.get('missing_independent_cohorts') == []
          assert report['counts'] == {'tables': 17, 'outer_figure_groups': 7, 'narrative_anchors': 16}
          assert report['original_paper_fully_reproduced'] is False and report['completion_percentage'] is None
          assert models['original_paper_fully_reproduced'] is False and models['fresh_experiments_by_ledger'] is False
          assert targets.get('ptx_pointwise_proof', {}).get('prefix') == 'reproduction/ptx/results/full-size-relu-proof-v1'
          assert ptx.get('independent_source_bound_development_proofs') == 1
          assert ptx.get('retained_positive_Main_checks') == 4 and ptx.get('positive_rechecks') == 3
          assert ptx.get('direct_Lean_negative_controls') == 4 and ptx.get('successful_source_CI_jobs') == 19
          assert ptx.get('new_registered_source_certificates') == 0
          assert ptx.get('original_paper_fully_reproduced') is ptx.get('nvidia_execution') is False
          assert targets.get('ptx_dot_proof', {}).get('prefix') == 'reproduction/ptx/results/full-size-gemv-proof-v1'
          assert gemv.get('independent_source_bound_development_proofs') == 1
          assert gemv.get('retained_positive_Main_checks') == 4 and gemv.get('positive_rechecks') == 3
          assert gemv.get('direct_Lean_negative_controls') == 4 and gemv.get('successful_source_CI_jobs') == 20
          assert gemv.get('new_registered_source_certificates') == 0
          assert gemv.get('original_paper_fully_reproduced') is gemv.get('nvidia_execution') is False
          assert targets.get('ptx_matrix_proof', {}).get('prefix') == 'reproduction/ptx/results/full-size-gemm-proof-v1'
          assert gemm.get('independent_source_bound_development_proofs') == 1
          assert gemm.get('retained_positive_Main_checks') == 4 and gemm.get('positive_rechecks') == 3
          assert gemm.get('direct_Lean_negative_controls') == 4 and gemm.get('successful_source_CI_jobs') == 21
          assert gemm.get('new_registered_source_certificates') == 0
          assert gemm.get('original_paper_fully_reproduced') is gemm.get('nvidia_execution') is False
          assert targets.get('ptx_batched_proof', {}).get('prefix') == 'reproduction/ptx/results/full-size-bmm-proof-v1'
          assert bmm.get('independent_source_bound_development_proofs') == 1
          assert bmm.get('retained_positive_Main_checks') == 5 and bmm.get('positive_rechecks') == 4
          assert bmm.get('current_SDK_positive_Main_checks') == 4 and bmm.get('initial_SDK_positive_Main_checks') == 1
          assert bmm.get('retained_failed_official_exports') == 1
          assert bmm.get('owned_module_builds_across_four_current_checks') == 32
          assert bmm.get('direct_Lean_negative_controls') == 4 and bmm.get('successful_source_CI_jobs') == 22
          assert bmm.get('archives_checked') == 9 and bmm.get('archive_members_checked') == 702
          assert bmm.get('new_registered_source_certificates') == 0
          assert bmm.get('original_paper_fully_reproduced') is bmm.get('nvidia_execution') is bmm.get('fresh_experiments_by_ledger') is False
          assert targets.get('ptx_linear_proof', {}).get('prefix') == 'reproduction/ptx/results/full-size-linear-proof-v1'
          assert linear.get('independent_source_bound_development_proofs') == 1
          assert linear.get('retained_positive_Main_checks') == 4 and linear.get('positive_rechecks') == 3
          assert linear.get('retained_failed_official_exports') == 0
          assert linear.get('retained_pre_SDK_development_attempts') == 12
          assert linear.get('accepted_pre_SDK_development_checks') == 7 and linear.get('failed_pre_SDK_development_checks') == 5
          assert linear.get('owned_module_builds_across_four_checks') == 40
          assert linear.get('direct_Lean_negative_controls') == 4 and linear.get('successful_source_CI_jobs') == 23
          assert linear.get('archives_checked') == 7 and linear.get('archive_members_checked') == 960
          assert linear.get('new_registered_source_certificates') == 0
          assert linear.get('original_paper_fully_reproduced') is linear.get('nvidia_execution') is linear.get('fresh_experiments_by_ledger') is False
          assert targets.get('ptx_rotary_proof', {}).get('prefix') == 'reproduction/ptx/results/full-size-rotary-proof-v1'
          assert rotary.get('independent_source_bound_development_proofs') == 1
          assert rotary.get('retained_positive_Main_checks') == 4 and rotary.get('positive_rechecks') == 3
          assert rotary.get('development_attempts') == 17 and rotary.get('failed_development_checks') == 11
          assert rotary.get('fresh_owned_module_builds') == 32
          assert rotary.get('direct_Lean_negative_controls') == 4 and rotary.get('successful_source_CI_jobs') == 24
          assert rotary.get('archives_checked') == 18 and rotary.get('archive_members_checked') == 4414
          assert rotary.get('anonymous_publication_files') == 81
          assert rotary.get('new_registered_source_certificates') == 0
          assert rotary.get('original_paper_fully_reproduced') is rotary.get('nvidia_execution') is rotary.get('fresh_experiments_by_ledger') is False
          assert all(report[name] == 0 for name in ('fresh_lean_checks', 'fresh_gpu_trials', 'model_calls'))
          assert all(row['original_result_reproduced'] is False for row in report['floats'] + report['narrative']
                     if row['role'] in ('experiment', 'history'))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('LARK_PAPER_SNAPSHOT=' + str(snapshot) + '\n')
          PY
      - name: Regenerate all six model cohorts from the raw and fresh-audit packets
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from reproduction.local_models import compare_full_shape
          snapshot = Path(os.environ['LARK_PAPER_SNAPSHOT'])
          spec = json.loads((snapshot / 'targets.json').read_text())['full_shape_models']
          fresh = compare_full_shape.compare([Path(row['prefix']) for row in spec['packets']])
          prefix = Path(spec['comparison_prefix'])
          recorded = json.loads((prefix / 'results.json').read_text())
          assert {k: v for k, v in fresh.items() if k != 'created_at_utc'} == {k: v for k, v in recorded.items() if k != 'created_at_utc'}
          assert compare_full_shape.markdown(fresh) == (prefix / 'RESULTS.md').read_text()
          print(json.dumps({'complete_independent_cohorts': 6, 'model_calls': 0, 'fresh_lean_checks': 0, 'gpu_trials': 0}))
          PY
      - name: Fetch the pinned original manuscript as data
        run: |
          curl -q --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 90 -fsSL \
            https://arxiv.org/src/2611.02028v1 --output /tmp/lark-paper-source.tar
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          data = Path('/tmp/lark-paper-source.tar').read_bytes()
          assert hashlib.sha256(data).hexdigest() == '095aae393369d4e8459e5c4c46af73b83ee9765ce786f4ebb870d2cd0cdf20d2'
          PY
      - name: Replay the frozen ledger and all rehashed controls without Git
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          output = Path('/tmp/lark-paper-ci-controls')
          command = ['timeout', '--kill-after=5s', '300s', sys.executable,
                     'reproduction/paper_results/check_snapshot_controls.py',
                     '--snapshot', os.environ['LARK_PAPER_SNAPSHOT'],
                     '--source-archive', '/tmp/lark-paper-source.tar', '--output', str(output)]
          result = subprocess.run(command)
          for path in sorted(output.glob('*.log')):
              print(json.dumps({'control_log': path.name, 'text': path.read_text()}), flush=True)
          if result.returncode == 0:
              record = json.loads((output / 'results.json').read_text())
              assert record['positive_replays'] == 9 and record['negative_controls'] == 89
              assert len(record['checks']) == len({row['name'] for row in record['checks']}) == 98
              assert len(record['released_completed_temporary_control_copies']) == 88
              assert record['all_control_payloads_complete_during_replay'] is True
          raise SystemExit(result.returncode)
          PY
  reference-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LARK_REAL_PROJECT: ${{ github.workspace }}/lean-real
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned Lean toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/58e8d545e33641f66dbcbd22c4283109e71757be/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch locked optional dependencies
        run: |
          MATHLIB_NO_CACHE_ON_UPDATE=1 lake update
          git diff --exit-code -- lake-manifest.json
        working-directory: lean-real
      - name: Fetch selected Mathlib cache
        run: |
          lake exe cache get Mathlib.Data.Complex.Trigonometric \
            Mathlib.Analysis.SpecialFunctions.Sqrt \
            Mathlib.Algebra.BigOperators.Group.List.Basic Mathlib.Tactic.NormNum Mathlib.Data.Nat.Bitwise \
            Mathlib.Tactic.FieldSimp Mathlib.Tactic.Ring
        working-directory: lean-real
      - name: Extract the two independently pinned full-size preparations as data
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile
          for name, destination in [('full-shape-preparation-v2','/tmp/lark-reference-hip'),
                                    ('full-shape-cuda-preparation-v1','/tmp/lark-reference-cuda')]:
              root = Path(destination)
              root.mkdir(exist_ok=False)
              with tarfile.open('reproduction/local_models/results/'+name+'/preparation.tar.gz') as archive:
                  for member in archive:
                      relative = PurePosixPath(member.name)
                      assert member.isfile() and not relative.is_absolute() and '..' not in relative.parts
                      path = root / relative
                      path.parent.mkdir(parents=True, exist_ok=True)
                      path.write_bytes(archive.extractfile(member).read())
          PY
      - name: Recheck all seventeen source-specification identities and wrong-operator refusal on CPU
        run: |
          python3 reproduction/local_models/reference_identity.py \
            --hip-prepared /tmp/lark-reference-hip --cuda-prepared /tmp/lark-reference-cuda \
            --output /tmp/lark-reference-identities --lean "$HOME/.elan/bin/lean"
  native-awq-real:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned Lean toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/58e8d545e33641f66dbcbd22c4283109e71757be/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch locked optional dependencies
        run: |
          MATHLIB_NO_CACHE_ON_UPDATE=1 lake update
          git diff --exit-code -- lake-manifest.json
        working-directory: lean-real
      - name: Fetch selected Mathlib cache
        run: |
          lake exe cache get Mathlib.Data.Complex.Trigonometric \
            Mathlib.Analysis.SpecialFunctions.Sqrt \
            Mathlib.Algebra.BigOperators.Group.List.Basic Mathlib.Tactic.NormNum Mathlib.Data.Nat.Bitwise \
            Mathlib.Tactic.FieldSimp Mathlib.Tactic.Ring
        working-directory: lean-real
      - name: Export and recheck four complete native AWQ real certificates and rejection controls
        run: python3 reproduction/production_awq_gemm/check_native_real.py --output /tmp/lark-awq-canonical-real
      - name: Rebuild frozen native AWQ proofs without Git or owned compiled objects
        run: |
          python3 reproduction/production_awq_gemm/replay_native_real.py \
            --packet /tmp/lark-awq-canonical-real --output /tmp/lark-awq-canonical-real-replay \
            --lean-bin "$HOME/.elan/bin" --dependency-project lean-real
      - name: Reject fully rehashed proof scope changes before extraction
        run: |
          python3 reproduction/production_awq_gemm/check_native_real_stages.py \
            --packet /tmp/lark-awq-canonical-real --output /tmp/lark-awq-canonical-real-stage-guards \
            --lean-bin "$HOME/.elan/bin" --dependency-project lean-real
      - name: Verify, recheck and reject a rehashed certificate from an installed wheel outside the checkout
        run: |
          python3 reproduction/production_awq_gemm/check_installed.py \
            --output /tmp/lark-awq-installed-wheel --lean "$HOME/.elan/bin/lean" \
            --dependency-project lean-real
  native-awq-components:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned Lean toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/58e8d545e33641f66dbcbd22c4283109e71757be/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check typed native matrix execution and mutation controls
        run: python3 -m unittest discover -s tests -p test_native_awq_gemm.py -v
      - name: Check all four finite source executions and traffic
        run: python3 reproduction/production_awq_gemm/run_symbolic.py --output /tmp/lark-awq-finite
      - name: Check complete source identity, K loop, guarded stores and whole grid execution
        run: |
          python3 reproduction/production_awq_gemm/check_components.py \
            --output /tmp/lark-awq-components --lean-bin "$HOME/.elan/bin"
      - name: Replay standalone source archive without Git or an owned cache
        run: |
          python3 reproduction/production_awq_gemm/replay_components.py \
            --packet /tmp/lark-awq-components --archive /tmp/lark-awq-components/source-project.tar.gz \
            --output /tmp/lark-awq-component-replay --lean-bin "$HOME/.elan/bin"
      - name: Reject fully rehashed false stage claims before extraction
        run: |
          python3 reproduction/production_awq_gemm/check_component_stages.py \
            --packet /tmp/lark-awq-components --output /tmp/lark-awq-component-stages \
            --lean-bin "$HOME/.elan/bin"
      - name: Replay the historical first-decode source archive
        run: |
          python3 reproduction/production_awq_gemm/replay_components.py \
            --packet reproduction/production_awq_gemm/results/source-components-v1 \
            --archive reproduction/production_awq_gemm/results/source-components-v1/source-project.tar.gz \
            --output /tmp/lark-awq-legacy-replay --lean-bin "$HOME/.elan/bin"
  native-sglang-real:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned Lean toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/58e8d545e33641f66dbcbd22c4283109e71757be/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch locked optional dependencies
        run: |
          MATHLIB_NO_CACHE_ON_UPDATE=1 lake update
          git diff --exit-code -- lake-manifest.json
        working-directory: lean-real
      - name: Fetch selected Mathlib cache
        run: |
          lake exe cache get Mathlib.Data.Complex.Trigonometric \
            Mathlib.Analysis.SpecialFunctions.Sqrt \
            Mathlib.Algebra.BigOperators.Group.List.Basic Mathlib.Tactic.NormNum Mathlib.Data.Nat.Bitwise \
            Mathlib.Tactic.FieldSimp Mathlib.Tactic.Ring
        working-directory: lean-real
      - name: Check native SGLang RMSNorm real certificates and controls
        run: python3 reproduction/production_sglang_rmsnorm/check_native_real.py --output /tmp/lark-sglang-canonical-real
      - name: Replay frozen native SGLang RMSNorm real archive without Git or own compiled cache
        run: |
          python3 reproduction/production_sglang_rmsnorm/replay_native_real.py \
            --packet /tmp/lark-sglang-canonical-real --output /tmp/lark-sglang-canonical-real-replay \
            --lean-bin "$HOME/.elan/bin" --dependency-project lean-real
      - name: Reject fully rehashed proof scope claims before extraction
        run: |
          python3 reproduction/production_sglang_rmsnorm/check_native_real_stages.py \
            --packet /tmp/lark-sglang-canonical-real --output /tmp/lark-sglang-canonical-real-stage-guards \
            --lean-bin "$HOME/.elan/bin" --dependency-project lean-real
      - name: Verify and recheck a certificate from an installed wheel outside the checkout
        env:
          LARK_REAL_PROJECT: ${{ github.workspace }}/lean-real
        run: |
          python3 -m pip wheel . --no-deps --wheel-dir /tmp/lark-sglang-wheel
          python3 -m venv /tmp/lark-sglang-installed
          /tmp/lark-sglang-installed/bin/pip install --no-index --no-deps /tmp/lark-sglang-wheel/*.whl
          cd /tmp
          /tmp/lark-sglang-installed/bin/lark verify-native-sglang-rmsnorm \
            "$GITHUB_WORKSPACE/reproduction/production_sglang_rmsnorm/cases/native_fixed/kernel.hip" \
            --reference "$GITHUB_WORKSPACE/reproduction/production_sglang_rmsnorm/cases/native_fixed/reference.py" \
            --task "$GITHUB_WORKSPACE/reproduction/production_sglang_rmsnorm/cases/native_fixed/task.json" \
            --output /tmp/lark-sglang-installed-certificate --lean "$HOME/.elan/bin/lean" --timeout 600
          /tmp/lark-sglang-installed/bin/lark check /tmp/lark-sglang-installed-certificate \
            --lean "$HOME/.elan/bin/lean" --timeout 600
  native-flashinfer-real:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned Lean toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/58e8d545e33641f66dbcbd22c4283109e71757be/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch locked optional dependencies
        run: |
          MATHLIB_NO_CACHE_ON_UPDATE=1 lake update
          git diff --exit-code -- lake-manifest.json
        working-directory: lean-real
      - name: Fetch selected Mathlib cache
        run: |
          lake exe cache get Mathlib.Data.Complex.Trigonometric \
            Mathlib.Analysis.SpecialFunctions.Sqrt \
            Mathlib.Algebra.BigOperators.Group.List.Basic Mathlib.Tactic.NormNum Mathlib.Data.Nat.Bitwise \
            Mathlib.Tactic.FieldSimp Mathlib.Tactic.Ring
        working-directory: lean-real
      - name: Check native FlashInfer RMSNorm real certificates and controls
        run: python3 reproduction/production_flashinfer_rmsnorm/check_native_real.py --output /tmp/lark-flashinfer-canonical-real
      - name: Replay frozen native FlashInfer RMSNorm real archive without Git or own compiled cache
        run: |
          python3 reproduction/production_flashinfer_rmsnorm/replay_native_real.py \
            --packet /tmp/lark-flashinfer-canonical-real --output /tmp/lark-flashinfer-canonical-real-replay \
            --lean-bin "$HOME/.elan/bin" --dependency-project lean-real
      - name: Verify and recheck a certificate from an installed wheel outside the checkout
        env:
          LARK_REAL_PROJECT: ${{ github.workspace }}/lean-real
        run: |
          python3 -m pip wheel . --no-deps --wheel-dir /tmp/lark-flashinfer-wheel
          python3 -m venv /tmp/lark-flashinfer-installed
          /tmp/lark-flashinfer-installed/bin/pip install --no-index --no-deps /tmp/lark-flashinfer-wheel/*.whl
          cd /tmp
          /tmp/lark-flashinfer-installed/bin/lark verify-native-flashinfer-rmsnorm \
            "$GITHUB_WORKSPACE/reproduction/production_flashinfer_rmsnorm/cases/native_16384/kernel.hip" \
            --reference "$GITHUB_WORKSPACE/reproduction/production_flashinfer_rmsnorm/cases/native_16384/reference.py" \
            --task "$GITHUB_WORKSPACE/reproduction/production_flashinfer_rmsnorm/cases/native_16384/task.json" \
            --output /tmp/lark-flashinfer-installed-certificate --lean "$HOME/.elan/bin/lean" --timeout 600
          /tmp/lark-flashinfer-installed/bin/lark check /tmp/lark-flashinfer-installed-certificate \
            --lean "$HOME/.elan/bin/lean" --timeout 600
  native-sglang-rmsnorm:
    runs-on: ubuntu-latest
    timeout-minutes: 40
